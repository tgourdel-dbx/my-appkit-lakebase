name: Deploy Lakebase Preview

# For every open pull request, deploy an ephemeral preview app to Databricks
# Apps, backed by a fresh Lakebase branch cloned from production.
#
#   - The Lakebase branch (pr-<number>) is a copy-on-write clone of production,
#     so the preview runs against real-shaped data in full isolation.
#   - Database migrations are applied to that branch before the app deploys,
#     but only if the PR's code actually ships a migrate script (so this is a
#     no-op until migration tooling lands on the branch).
#   - The preview app (appkit-lakebase-pr-<number>) deploys the PR's head
#     branch and connects to the pr-<number> Lakebase branch.
#
# Both the app and the branch are torn down by the `Cleanup Lakebase Branch`
# workflow when the PR is closed or merged.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Cancel an in-flight deploy when a newer commit is pushed to the same PR.
concurrency:
  group: lakebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    env:
      # Databricks auth via OAuth M2M (service principal client id + secret).
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

      LAKEBASE_PROJECT_ID: ${{ vars.LAKEBASE_PROJECT_ID }}
      LAKEBASE_PARENT_BRANCH: production
      LAKEBASE_DATABASE_ID: databricks-postgres

      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head so migrations and the deploy use its code.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: databricks/setup-cli@main
        with:
          # Pin the CLI instead of floating on latest so preview deploys are
          # reproducible. The direct deploy engine (CLI default since v1.x)
          # nil-pointer panics while planning a rename of the shared-state App
          # resource (dresources/app.go OverrideChangeDesc), so we force the
          # Terraform engine (see the deploy step). This pin is a version that
          # still ships the Terraform engine, which is deprecated and slated
          # for removal on latest; revisit once the direct-engine App bug is
          # fixed upstream.
          version: 1.15.0

      - name: Resolve preview identifiers
        id: preview
        shell: bash
        run: |
          LAKEBASE_BRANCH="pr-${PR_NUMBER}"
          APP_NAME="appkit-lakebase-pr-${PR_NUMBER}"
          echo "lakebase_branch=$LAKEBASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "branch_resource=projects/${LAKEBASE_PROJECT_ID}/branches/${LAKEBASE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Create Lakebase branch (fresh clone of production)
        shell: bash
        env:
          BRANCH_RESOURCE: ${{ steps.preview.outputs.branch_resource }}
          LAKEBASE_BRANCH: ${{ steps.preview.outputs.lakebase_branch }}
        run: |
          PROJECT="projects/${LAKEBASE_PROJECT_ID}"
          PARENT="${PROJECT}/branches/${LAKEBASE_PARENT_BRANCH}"

          if databricks postgres get-branch "$BRANCH_RESOURCE" >/dev/null 2>&1; then
            echo "Lakebase branch already exists: $LAKEBASE_BRANCH"
          else
            echo "Creating Lakebase branch $LAKEBASE_BRANCH from $LAKEBASE_PARENT_BRANCH"
            databricks postgres create-branch \
              "$PROJECT" \
              "$LAKEBASE_BRANCH" \
              --json "{
                \"spec\": {
                  \"source_branch\": \"${PARENT}\",
                  \"ttl\": \"2505600s\"
                }
              }"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run database migrations (only if the PR ships a migrate script)
        shell: bash
        env:
          # @databricks/lakebase resolves the connection from these plus the
          # OAuth M2M env above; it refreshes the DB token automatically.
          PGHOST: ${{ vars.PGHOST }}
          PGPORT: "5432"
          PGSSLMODE: require
          PGDATABASE: ${{ env.LAKEBASE_DATABASE_ID }}
          LAKEBASE_ENDPOINT: ${{ steps.preview.outputs.branch_resource }}/databases/${{ env.LAKEBASE_DATABASE_ID }}
        run: |
          if npm run 2>/dev/null | grep -qE '^  migrate$'; then
            echo "migrate script found — applying migrations to ${{ steps.preview.outputs.lakebase_branch }}"
            npm ci
            npm run migrate
          else
            echo "No migrate script in this PR — skipping migrations."
          fi

      - name: Deploy preview app
        shell: bash
        env:
          # The direct deploy engine (CLI default since v1.x) panics while
          # planning the App resource (SIGSEGV in dresources/app.go
          # OverrideChangeDesc). Pin the still-supported Terraform engine
          # until the direct-engine App bug is fixed upstream.
          DATABRICKS_BUNDLE_ENGINE: terraform
        run: |
          # --force-lock reclaims a stale deploy lock left behind by a
          # previously crashed run so reruns aren't blocked on it.
          databricks bundle deploy -t preview --force-lock \
            --var "pr_number=${PR_NUMBER}" \
            --var "git_branch=${GIT_BRANCH}"

          # Trigger the app deployment/start from the git source.
          databricks bundle run app -t preview \
            --var "pr_number=${PR_NUMBER}" \
            --var "git_branch=${GIT_BRANCH}"

      # -----------------------------------------------------------------------
      # Give the preview app ownership of its cloned schemas.
      #
      # Each pr-<n> branch is a copy-on-write clone of production, so its `app`
      # and `appkit` schemas (and their tables/sequences) are owned by whoever
      # owns them in production. The preview app runs as its OWN service
      # principal and must OWN those objects to run its startup schema setup
      # (CREATE/ALTER) — otherwise it fails with `permission denied for schema`
      # / `must be owner of table`. We transfer ownership of both schemas to the
      # preview app's SP, then restart the app so its setup re-runs cleanly.
      #
      # ONE-TIME PREREQUISITE (not automatable here): the CI service principal
      # (DATABRICKS_CLIENT_ID) must be a member of the `databricks_superuser`
      # Postgres role, set on the production branch so every clone inherits it
      # (see README). Reassigning ownership across roles requires superuser.
      # -----------------------------------------------------------------------
      - name: Give preview app ownership of its schemas
        shell: bash
        env:
          APP_NAME: ${{ steps.preview.outputs.app_name }}
          BRANCH_RESOURCE: ${{ steps.preview.outputs.branch_resource }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

          PREVIEW_SP="$(databricks apps get "$APP_NAME" -o json | jq -r '.service_principal_client_id')"
          if [[ -z "$PREVIEW_SP" || "$PREVIEW_SP" == "null" ]]; then
            echo "Could not resolve the preview app service principal." >&2
            exit 1
          fi

          EP="$(databricks postgres list-endpoints "$BRANCH_RESOURCE" -o json \
            | jq -r 'if type=="array" then . else (.endpoints // []) end
                     | (map(select((.spec.type // .type)=="ENDPOINT_TYPE_READ_WRITE")) | .[0].name)
                       // .[0].name')"
          if [[ -z "$EP" || "$EP" == "null" ]]; then
            echo "Could not resolve a read-write endpoint for $BRANCH_RESOURCE." >&2
            exit 1
          fi

          HOST="$(databricks postgres get-endpoint "$EP" -o json | jq -r '.status.hosts.host')"
          PGDB="$(databricks postgres get-database "${BRANCH_RESOURCE}/databases/databricks-postgres" -o json \
            | jq -r '.status.postgres_database // "databricks_postgres"')"
          TOKEN="$(databricks postgres generate-database-credential "$EP" -o json | jq -r '.token')"

          echo "Transferring ownership of schemas app, appkit (and their objects) to $PREVIEW_SP"

          # SET ROLE to superuser (membership alone does not grant the attribute),
          # then generate + run ALTER ... OWNER TO for the schemas and every table
          # and sequence in them, regardless of their current owner. Idempotent.
          PGPASSWORD="$TOKEN" psql \
            "host=${HOST} port=5432 user=${DATABRICKS_CLIENT_ID} dbname=${PGDB} sslmode=require" \
            -v ON_ERROR_STOP=1 -v owner="$PREVIEW_SP" <<'SQL'
          SET ROLE databricks_superuser;
          SELECT format('ALTER SCHEMA %I OWNER TO %I', nspname, :'owner')
            FROM pg_namespace WHERE nspname IN ('app', 'appkit')
          UNION ALL
          SELECT format('ALTER TABLE %I.%I OWNER TO %I', schemaname, tablename, :'owner')
            FROM pg_tables WHERE schemaname IN ('app', 'appkit')
          UNION ALL
          SELECT format('ALTER SEQUENCE %I.%I OWNER TO %I', schemaname, sequencename, :'owner')
            FROM pg_sequences WHERE schemaname IN ('app', 'appkit')
          \gexec
          SQL

      - name: Restart preview app so schema setup re-runs
        shell: bash
        env:
          APP_NAME: ${{ steps.preview.outputs.app_name }}
        run: |
          set -euo pipefail
          databricks apps stop "$APP_NAME"
          databricks apps start "$APP_NAME"

      - name: Read preview app URL
        id: url
        shell: bash
        env:
          APP_NAME: ${{ steps.preview.outputs.app_name }}
        run: |
          APP_URL="$(databricks apps get "$APP_NAME" -o json | jq -r '.url')"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ steps.preview.outputs.app_name }}
          APP_URL: ${{ steps.url.outputs.app_url }}
          LAKEBASE_BRANCH: ${{ steps.preview.outputs.lakebase_branch }}
        shell: bash
        run: |
          BODY="$(cat <<EOF
          ### 🚀 Lakebase preview deployed

          | | |
          | --- | --- |
          | **Preview app** | [\`${APP_NAME}\`](${APP_URL}) |
          | **Lakebase branch** | \`${LAKEBASE_BRANCH}\` (fresh clone of \`production\`) |
          | **Deployed commit** | \`${{ github.event.pull_request.head.sha }}\` |

          This preview and its database branch are deleted automatically when the PR is closed.
          EOF
          )"

          # Upsert: reuse the existing preview comment if one is already posted.
          MARKER="<!-- lakebase-preview -->"
          BODY="${BODY}"$'\n'"${MARKER}"
          EXISTING="$(gh pr view "$PR_NUMBER" --json comments \
            --jq ".comments[] | select(.body | contains(\"${MARKER}\")) | .url" | head -n1)"

          if [[ -n "$EXISTING" ]]; then
            gh pr comment "$PR_NUMBER" --edit-last --body "$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
