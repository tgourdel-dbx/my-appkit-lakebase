name: PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: databricks-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview

    env:
      # Databricks auth via GitHub OIDC / workload identity federation (no secret).
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

      LAKEBASE_PROJECT_ID: ${{ vars.LAKEBASE_PROJECT_ID }}
      LAKEBASE_DATABASE_ID: ${{ vars.LAKEBASE_DATABASE_ID }}

      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
      GIT_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: databricks/setup-cli@main

      - name: Compute preview names
        id: preview
        shell: bash
        run: |
          LAKEBASE_BRANCH="$(bash scripts/branch-name.sh "$GIT_BRANCH")"

          # Databricks App names must be <= 26 chars, lowercase/hyphen only.
          APP_NAME="appkit-lakebase-pr-${PR_NUMBER}"

          echo "branch=$LAKEBASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "app=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure Lakebase branch exists
        shell: bash
        run: |
          BRANCH="projects/${LAKEBASE_PROJECT_ID}/branches/${{ steps.preview.outputs.branch }}"

          if ! databricks postgres get-branch "$BRANCH" >/dev/null 2>&1; then
            databricks postgres create-branch \
              "projects/${LAKEBASE_PROJECT_ID}" \
              "${{ steps.preview.outputs.branch }}" \
              --json "{
                \"spec\": {
                  \"source_branch\": \"projects/${LAKEBASE_PROJECT_ID}/branches/production\",
                  \"no_expiry\": true
                }
              }"
          fi

      - name: Validate bundle
        run: |
          databricks bundle validate \
            --target preview \
            --var="pr_number=${PR_NUMBER}" \
            --var="app_name=${{ steps.preview.outputs.app }}" \
            --var="git_sha=${GIT_SHA}" \
            --var="lakebase_project_id=${LAKEBASE_PROJECT_ID}" \
            --var="lakebase_branch=${{ steps.preview.outputs.branch }}" \
            --var="lakebase_database_id=${LAKEBASE_DATABASE_ID}"

      - name: Deploy preview
        run: |
          databricks bundle deploy \
            --target preview \
            --var="pr_number=${PR_NUMBER}" \
            --var="app_name=${{ steps.preview.outputs.app }}" \
            --var="git_sha=${GIT_SHA}" \
            --var="lakebase_project_id=${LAKEBASE_PROJECT_ID}" \
            --var="lakebase_branch=${{ steps.preview.outputs.branch }}" \
            --var="lakebase_database_id=${LAKEBASE_DATABASE_ID}"

      # The preview branch is a copy-on-write clone of production, so the `app`
      # schema it inherits is owned by production's service principal. The
      # preview app runs as its OWN service principal, which therefore cannot
      # write to or migrate that schema. Reassign ownership of the schema (and
      # its objects) to the preview app's SP, on this branch only. This must run
      # as a role with superuser on the project (the CI SP needs databricks_superuser).
      - name: Bootstrap preview schema ownership
        shell: bash
        env:
          PREVIEW_APP: ${{ steps.preview.outputs.app }}
          LAKEBASE_BRANCH: ${{ steps.preview.outputs.branch }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          EP="projects/${LAKEBASE_PROJECT_ID}/branches/${LAKEBASE_BRANCH}/endpoints/primary"
          HOST="$(databricks postgres get-endpoint "$EP" --output json | jq -r '.status.hosts.host')"
          TOKEN="$(databricks postgres generate-database-credential "$EP" --output json | jq -r '.token')"
          PREVIEW_SP="$(databricks apps get "$PREVIEW_APP" --output json | jq -r '.service_principal_client_id')"

          # Connect as the CI service principal (its client id is its Postgres role).
          PGPASSWORD="$TOKEN" psql \
            "host=$HOST user=${DATABRICKS_CLIENT_ID} dbname=databricks_postgres sslmode=require" \
            -v ON_ERROR_STOP=1 <<SQL
          ALTER SCHEMA app OWNER TO "$PREVIEW_SP";
          ALTER TABLE IF EXISTS app.todos OWNER TO "$PREVIEW_SP";
          ALTER SEQUENCE IF EXISTS app.todos_id_seq OWNER TO "$PREVIEW_SP";
          SQL

      # `bundle deploy` alone does not (re)start the app on a new commit.
      # Restarting here also re-runs the app's startup migration, which now
      # succeeds because the preview SP owns the schema (see previous step).
      - name: Start / restart preview app
        run: |
          databricks bundle run preview_app \
            --target preview \
            --var="pr_number=${PR_NUMBER}" \
            --var="app_name=${{ steps.preview.outputs.app }}" \
            --var="git_sha=${GIT_SHA}" \
            --var="lakebase_project_id=${LAKEBASE_PROJECT_ID}" \
            --var="lakebase_branch=${{ steps.preview.outputs.branch }}" \
            --var="lakebase_database_id=${LAKEBASE_DATABASE_ID}"

      - name: Get preview URL
        id: url
        shell: bash
        run: |
          URL="$(databricks apps get "${{ steps.preview.outputs.app }}" --output json | jq -r '.url')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "Databricks preview: ${{ steps.url.outputs.url }}

          Commit: \`${GIT_SHA}\`
          Lakebase branch: \`${{ steps.preview.outputs.branch }}\`"
